services:
  db:
    image: postgres:16-alpine
    container_name: CloudSpace-Postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cloudspace_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - my-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudspace} -d ${POSTGRES_DB:-cloudspace_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:latest
    container_name: CloudSpace-ClamAV
    expose:
      - "3310"
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - my-net
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  api:
    image: ${DOCKERHUB_USERNAME:-tisepse}/cloudspace-api:latest
    container_name: Backend-Flask
    expose:
      - "5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cloudspace}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-cloudspace_db}
      UPLOAD_FOLDER: /app/uploads
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      FLASK_APP: app.py
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - my-net

  client:
    image: ${DOCKERHUB_USERNAME:-tisepse}/cloudspace-client:latest
    container_name: Frontend-Vite
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - my-net

volumes:
  pgdata:
    driver: local
  uploads_data:
    driver: local
  clamav_db:
    driver: local

networks:
  my-net:
