name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type de build'
        type: choice
        options:
          - debug
          - release
        default: debug

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Determine build mode
        id: mode
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          INPUT_TYPE: ${{ github.event.inputs.build_type }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$IS_TAG" = "true" ] || [ "$INPUT_TYPE" = "release" ]; then
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo "mode=release" >> $GITHUB_OUTPUT
            else
              echo "::warning::ANDROID_KEYSTORE_BASE64 manquant — fallback sur debug"
              echo "mode=debug" >> $GITHUB_OUTPUT
            fi
          else
            echo "mode=debug" >> $GITHUB_OUTPUT
          fi

      - name: Decode keystore
        if: steps.mode.outputs.mode == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/cloudspace.jks

      - name: Configure signing
        if: steps.mode.outputs.mode == 'release'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat <<EOF > android/keystore.properties
          storeFile=cloudspace.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        if: steps.mode.outputs.mode == 'release'
        working-directory: client/android
        run: ./gradlew assembleRelease

      - name: Build debug APK
        if: steps.mode.outputs.mode == 'debug'
        working-directory: client/android
        run: ./gradlew assembleDebug

      - name: Locate APK
        id: apk
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "release" ]; then
            echo "path=client/android/app/build/outputs/apk/release/app-release.apk" >> $GITHUB_OUTPUT
            echo "name=cloudspace-release-apk" >> $GITHUB_OUTPUT
          else
            echo "path=client/android/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
            echo "name=cloudspace-debug-apk" >> $GITHUB_OUTPUT
          fi
        working-directory: ${{ github.workspace }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      - name: Compute release metadata
        id: rel
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=build-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "name=Build #${{ github.run_number }} (${{ steps.mode.outputs.mode }})" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi
        working-directory: ${{ github.workspace }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          generate_release_notes: true
