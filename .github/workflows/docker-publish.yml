name: Build & Push Docker images

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cloudspace-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Client
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_TURNSTILE_SITE_KEY=${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cloudspace-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup old Docker Hub tags (keep only :latest)
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -e
          TOKEN=$(curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"username\":\"$DH_USER\",\"password\":\"$DH_PASS\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          for image in cloudspace-api cloudspace-client; do
            echo "→ Nettoyage de $DH_USER/$image"
            tags=$(curl -s -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/$DH_USER/$image/tags/?page_size=100" \
              | jq -r '.results[].name' | grep -v '^latest$' || true)
            for tag in $tags; do
              echo "   - delete $image:$tag"
              curl -s -X DELETE -H "Authorization: JWT $TOKEN" \
                "https://hub.docker.com/v2/repositories/$DH_USER/$image/tags/$tag/" > /dev/null
            done
          done
