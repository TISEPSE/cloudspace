name: Build & Push Docker images

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudspace-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudspace-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Client
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_TURNSTILE_SITE_KEY=${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudspace-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudspace-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
